<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界洋流填空挑戰</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }
        /* 地圖容器 */
        #map-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px auto;
            border: 2px solid #333;
            /* 確保容器大小與圖片一致 */
            line-height: 0; 
        }
        #map-image {
            display: block;
            max-width: 100%;
            height: auto;
        }
        
        /* 洋流覆蓋區域的通用樣式 */
        .current-overlay {
            position: absolute;
            border: 2px solid transparent;
            transition: all 0.3s;
            pointer-events: none; /* 讓滑鼠點擊穿透，避免擋住視線 */
        }
        /* 被選中題目時的高亮樣式 */
        .active-question {
            background-color: rgba(231, 76, 60, 0.5) !important; /* 半透明紅色 */
            border-color: #e74c3c !important;
            box-shadow: 0 0 10px #e74c3c;
        }

        /* --- 定義20個區域的位置與大小 (百分比) --- */
        /* 太平洋 */
        #overlay-a { top: 50%; left: 35%; width: 30%; height: 8%; } /* 北赤道 */
        #overlay-b { top: 35%; left: 28%; width: 10%; height: 18%; } /* 黑潮 */
        #overlay-c { top: 35%; left: 38%; width: 20%; height: 8%; } /* 北太平洋 */
        #overlay-d { top: 35%; left: 58%; width: 8%; height: 18%; } /* 加利福尼亞 */
        #overlay-e { top: 20%; left: 50%; width: 10%; height: 12%; } /* 阿拉斯加 */
        #overlay-f { top: 20%; left: 33%; width: 10%; height: 15%; } /* 親潮 */
        #overlay-g { top: 58%; left: 35%; width: 30%; height: 5%; } /* 赤道逆 */
        #overlay-h { top: 63%; left: 35%; width: 30%; height: 8%; } /* 南赤道 */
        #overlay-i { top: 70%; left: 40%; width: 8%; height: 15%; } /* 東澳 */
        #overlay-k { top: 65%; left: 68%; width: 8%; height: 20%; } /* 秘魯 */
        
        /* 印度洋/南冰洋 */
        #overlay-l { top: 65%; left: 22%; width: 8%; height: 18%; } /* 西澳 */
        #overlay-n { top: 75%; left: 5%; width: 10%; height: 15%; } /* 阿古拉斯 */
        #overlay-j { top: 90%; left: 10%; width: 80%; height: 8%; } /* 西風漂流 */

        /* 大西洋 */
        #overlay-m { top: 40%; left: 73%; width: 10%; height: 10%; } /* 墨西哥灣 */
        #overlay-o { top: 32%; left: 80%; width: 15%; height: 8%; } /* 北大西洋 */
        #overlay-p { top: 40%; left: 85%; width: 8%; height: 18%; } /* 加那利 */
        #overlay-q { top: 18%; left: 72%; width: 8%; height: 15%; } /* 拉布拉多 */
        #overlay-r { top: 65%; left: 78%; width: 6%; height: 15%; } /* 巴西 */
        #overlay-s { top: 80%; left: 73%; width: 6%; height: 12%; } /* 福克蘭 */
        #overlay-t { top: 60%; left: 90%; width: 6%; height: 18%; } /* 本吉拉 */


        #options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            background: white;
            border: 2px solid #3498db;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover:not(:disabled) { background: #3498db; color: white; }
        button:disabled { border-color: #ccc; color: #999; }

        #feedback-box {
            margin: 20px 0;
            font-size: 24px;
            font-weight: bold;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .correct-text { color: #27ae60; }
        .wrong-text { color: #e74c3c; }
        
        .result-screen { display: none; padding: 40px; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🌊 世界洋流挑戰 (區域對齊版)</h1>
    <p>請觀察地圖上<strong>紅色高亮的區域</strong>，並選出對應的洋流名稱</p>

    <div id="map-wrapper">
        <img id="map-image" src="洋流圖.jpg" alt="世界洋流地圖">
        <div id="overlay-a" class="current-overlay"></div>
        <div id="overlay-b" class="current-overlay"></div>
        <div id="overlay-c" class="current-overlay"></div>
        <div id="overlay-d" class="current-overlay"></div>
        <div id="overlay-e" class="current-overlay"></div>
        <div id="overlay-f" class="current-overlay"></div>
        <div id="overlay-g" class="current-overlay"></div>
        <div id="overlay-h" class="current-overlay"></div>
        <div id="overlay-i" class="current-overlay"></div>
        <div id="overlay-j" class="current-overlay"></div>
        <div id="overlay-k" class="current-overlay"></div>
        <div id="overlay-l" class="current-overlay"></div>
        <div id="overlay-m" class="current-overlay"></div>
        <div id="overlay-n" class="current-overlay"></div>
        <div id="overlay-o" class="current-overlay"></div>
        <div id="overlay-p" class="current-overlay"></div>
        <div id="overlay-q" class="current-overlay"></div>
        <div id="overlay-r" class="current-overlay"></div>
        <div id="overlay-s" class="current-overlay"></div>
        <div id="overlay-t" class="current-overlay"></div>
    </div>

    <div id="feedback-box">準備開始...</div>
    <div id="options-grid"></div>

    <div id="result-screen" class="result-screen">
        <h2 id="final-score"></h2>
        <p id="comment-text" style="font-size: 24px;"></p>
        <button onclick="location.reload()" style="background:#2ecc71; color:white; border:none; padding:15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer;">重新挑戰</button>
    </div>
</div>

<script>
    // 資料與正確答案
    const quizData = [
        { id: 'a', name: "北赤道洋流" },
        { id: 'b', name: "黑潮" },
        { id: 'c', name: "北太平洋暖流" },
        { id: 'd', name: "加利福尼亞涼流" },
        { id: 'e', name: "阿拉斯加暖流" },
        { id: 'f', name: "親潮" },
        { id: 'g', name: "赤道逆流" },
        { id: 'h', name: "南赤道洋流" },
        { id: 'i', name: "東澳暖流" },
        { id: 'j', name: "西風漂流" },
        { id: 'k', name: "秘魯涼流" },
        { id: 'l', name: "西澳涼流" },
        { id: 'm', name: "墨西哥灣流" },
        { id: 'n', name: "阿古拉斯暖流" },
        { id: 'o', name: "北大西洋暖流" },
        { id: 'p', name: "加那利涼流" },
        { id: 'q', name: "拉布拉多寒流" },
        { id: 'r', name: "巴西暖流" },
        { id: 's', name: "福克蘭寒流" },
        { id: 't', name: "本吉拉涼流" }
    ];

    // 確保按字母順序排列
    quizData.sort((a, b) => a.id.localeCompare(b.id));

    let currentIndex = 0;
    let score = 0;

    const feedback = document.getElementById('feedback-box');
    const optionsGrid = document.getElementById('options-grid');

    function initGame() {
        renderOptions();
        showQuestion();
    }

    function renderOptions() {
        optionsGrid.innerHTML = '';
        // 選項按名稱排序，方便找答案
        const allNames = quizData.map(item => item.name).sort((a, b) => a.localeCompare(b, 'zh-TW'));
        allNames.forEach(name => {
            const btn = document.createElement('button');
            btn.innerText = name;
            btn.onclick = () => checkAnswer(name);
            optionsGrid.appendChild(btn);
        });
    }

    function showQuestion() {
        // 移除所有舊的高亮
        document.querySelectorAll('.current-overlay').forEach(el => el.classList.remove('active-question'));

        if (currentIndex >= quizData.length) {
            showResult();
            return;
        }
        
        const q = quizData[currentIndex];
        // 高亮當前題目的區域
        const currentOverlay = document.getElementById(`overlay-${q.id}`);
        if (currentOverlay) {
            currentOverlay.classList.add('active-question');
        }
        
        feedback.innerHTML = `請回答地圖上紅色區域 (代號 ${q.id}) 的洋流名稱`;
        feedback.className = '';
        
        document.querySelectorAll('#options-grid button').forEach(b => b.disabled = false);
    }

    function checkAnswer(selectedName) {
        const correct = quizData[currentIndex].name;
        const currentId = quizData[currentIndex].id;
        document.querySelectorAll('#options-grid button').forEach(b => b.disabled = true);

        if (selectedName === correct) {
            score++;
            feedback.innerHTML = `✅ 答對了！代號 ${currentId} 是 ${correct}`;
            feedback.className = "correct-text";
            // 答對時，讓區域變綠色一下
            document.getElementById(`overlay-${currentId}`).style.backgroundColor = "rgba(46, 204, 113, 0.5)";
            document.getElementById(`overlay-${currentId}`).style.borderColor = "#2ecc71";
        } else {
            feedback.innerHTML = `❌ 答錯了！代號 ${currentId} 其實是 <span class="wrong-text">${correct}</span>`;
            feedback.className = "wrong-text";
        }

        setTimeout(() => {
            // 重置區域顏色樣式 (為了下一題)
            const overlay = document.getElementById(`overlay-${currentId}`);
            overlay.style.backgroundColor = "";
            overlay.style.borderColor = "";
            
            currentIndex++;
            showQuestion();
        }, 2000);
    }

    function showResult() {
        document.getElementById('map-wrapper').style.display = 'none';
        optionsGrid.style.display = 'none';
        feedback.style.display = 'none';
        const resultScreen = document.getElementById('result-screen');
        resultScreen.style.display = 'block';

        const rate = Math.round((score / quizData.length) * 100);
        document.getElementById('final-score').innerText = `你的答對率：${rate}% (${score}/${quizData.length})`;

        let comment = "";
        if (rate === 100) comment = "你超棒！你是洋流大師！🥇";
        else if (rate >= 80) comment = "很厲害喔，快要全對了！🌟";
        else if (rate >= 50) comment = "表現不錯，再複習一下會更好！👍";
        else comment = "還要加油喔，多看地圖認識地球的脈動！💪";
        
        document.getElementById('comment-text').innerText = comment;
    }

    // 圖片載入完成後再開始遊戲，確保高度計算正確
    window.onload = initGame;
</script>

</body>
</html>
