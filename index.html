<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>CSS 音樂節奏遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎵 音樂節奏遊戲</h1>
<p>請依序點擊節拍鍵</p>

<div class="game">

  <input type="radio" name="beat" id="b1">
  <label for="b1" class="beat beat1">♪</label>

  <input type="radio" name="beat" id="b2">
  <label for="b2" class="beat beat2">♫</label>

  <input type="radio" name="beat" id="b3">
  <label for="b3" class="beat beat3">♬</label>

  <div class="result">
    🎉 Perfect! 節奏完成！
  </div>

</div>

</body>
</html>
